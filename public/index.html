<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sacar - Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171b1f;
    --panel: #20262c;
    --line: #2f3841;
    --steel: #39424b;
    --steel-hi: #5b6772;
    --brass: #c8a04c;
    --brass-dk: #8f6f2a;
    --text: #e9e6df;
    --muted: #9aa3ab;
    --primer: #c4553d;
    --heading: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body { color: var(--text); font: 16px/1.4 var(--body); -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* A página ocupa exatamente a altura disponível: nada de rolagem da página. */
  .wrap {
    height: 100vh; height: 100dvh;
    max-width: 1180px; margin: 0 auto;
    padding: max(clamp(8px, 2dvh, 16px), env(safe-area-inset-top)) max(clamp(10px, 2vw, 16px), env(safe-area-inset-right))
             max(clamp(8px, 2dvh, 16px), env(safe-area-inset-bottom)) max(clamp(10px, 2vw, 16px), env(safe-area-inset-left));
    display: flex; flex-direction: column; gap: clamp(8px, 1.6dvh, 14px);
  }

  header { flex: none; display: none; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
  h1 { flex: 1 1 auto; margin: 0; font: 800 clamp(22px, 5.2dvh, 36px)/1 var(--heading); letter-spacing: .02em; white-space: nowrap; }
  .tabs { flex: 0 1 300px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .tab { border: 0; background: transparent; border-radius: 9px; min-height: clamp(34px, 6dvh, 44px); font: 600 clamp(17px, 3dvh, 20px)/1 var(--heading); letter-spacing: .03em; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--steel); color: var(--text); }
  .who {
    flex: none; background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 0 14px; min-height: clamp(34px, 6dvh, 40px); color: var(--muted); max-width: 46vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .who b { color: var(--text); font-weight: 600; }

  .view { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }

  .layout {
    flex: 1; min-height: 0; display: grid; gap: clamp(8px, 1.8dvh, 18px);
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr);
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: clamp(8px, 2dvh, 18px) clamp(10px, 2vw, 18px); min-height: 0; overflow: hidden;
  }
  .panel h2 { margin: 0 0 clamp(6px, 1.4dvh, 12px); font: 800 clamp(19px, 3.6dvh, 24px)/1 var(--heading); letter-spacing: .03em; }

  /* ---------- Tambor ---------- */
  .stage-panel { display: flex; flex-direction: column; text-align: center; }
  .cyl-area { flex: 1 1 0; min-height: 0; min-width: 0; container-type: size; display: grid; place-items: center; }
  .stage {
    --size: clamp(90px, 38dvh, 400px);                                  /* alternativa para navegadores antigos */
    --size: max(90px, min(calc(100cqmin - 24px), 520px));              /* ocupa o espaço livre sem estourar */
    position: relative; width: var(--size); height: var(--size); margin-top: 10px;
  }
  .marker {
    position: absolute; left: 50%; top: -16px; transform: translateX(-50%); transform-origin: 50% 0; z-index: 3;
    width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 26px solid var(--brass); filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .cyl {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #5d6872 0%, #333c44 55%, #232a30 100%);
    box-shadow: inset 0 0 0 4px #12161a, inset 0 0 0 8px #4b5660, 0 18px 40px rgba(0,0,0,.45);
    will-change: transform;
  }
  .ch {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    background: #101417;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.85), 0 0 0 3px #505c67;
    transition: box-shadow .35s;
  }
  .ch.on { box-shadow: inset 0 3px 8px rgba(0,0,0,.85), 0 0 0 3px var(--brass), 0 0 16px rgba(200,160,76,.45); }
  .lb {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0;
    text-align: center; font-family: var(--heading); font-weight: 800; line-height: 1;
    color: #d3d9de; transition: color .35s; will-change: transform;
  }
  .ch.on .lb { color: var(--brass); }
  .lb span { display: block; overflow: hidden; line-height: 1.02; overflow-wrap: normal; word-break: normal; hyphens: none; }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 15%; height: 15%; transform: translate(-50%, -50%);
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7a8793, #2a3138);
    box-shadow: 0 0 0 4px #14181b, 0 2px 6px rgba(0,0,0,.6);
  }
  .hub::after { content: ''; position: absolute; left: 50%; top: 12%; width: 14%; height: 30%; transform: translateX(-50%); background: var(--brass); border-radius: 2px; opacity: .85; }

  .controls { flex: none; display: flex; flex-direction: column; align-items: center; }
  .now { width: 100%; margin-top: clamp(4px, 1.4dvh, 16px); }
  .now small { display: block; color: var(--muted); font-size: 14px; }
  .now strong {
    display: block; margin-top: 2px; font: 800 clamp(24px, min(9vw, 7.5dvh), 54px)/1.05 var(--heading);
    color: var(--brass); overflow-wrap: anywhere; min-height: 1.05em;
  }
  .now .by { margin-top: 4px; min-height: 1.4em; }

  .spin {
    margin-top: clamp(6px, 1.6dvh, 14px); width: min(100%, 340px); min-height: clamp(42px, 7.5dvh, 56px);
    border: 0; border-radius: 12px; background: var(--brass); color: #1b1608;
    font: 800 clamp(20px, 3.6dvh, 26px)/1 var(--heading); letter-spacing: .05em;
    box-shadow: 0 4px 0 var(--brass-dk);
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  .spin:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--brass-dk); }
  .spin:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Fila ---------- */
  .queue-panel { display: none; flex-direction: column; }
  .queue { flex: 1 1 auto; min-height: 0; list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--steel) transparent; }
  .queue li { display: flex; align-items: center; gap: 10px; background: #1a2025; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 12px; min-height: 44px; }
  .queue li.cur { border-color: var(--brass); }
  .queue .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .queue .tag { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .queue li.cur .tag { color: var(--brass); font-weight: 600; }
  .rm { width: 36px; height: 36px; flex: none; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
  .rm:hover { background: var(--steel); color: var(--primer); }
  .empty { color: var(--muted); margin: 4px 0; }

  .add { flex: none; display: flex; gap: 8px; margin-top: clamp(8px, 1.6dvh, 14px); }
  .add input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; background: #14181b; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; }
  .btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--steel); font-weight: 600; }
  .btn:hover { background: var(--steel-hi); }
  .hint { flex: none; margin: 8px 0 0; font-size: 14px; color: var(--muted); }

  /* ---------- Histórico ---------- */
  .hist-panel { flex: 1 1 0; display: flex; flex-direction: column; }
  .hist { flex: 1 1 auto; min-height: 0; list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--steel) transparent; }
  .hist li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; background: #1a2025; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .hist .tx { overflow-wrap: anywhere; }
  .hist .tx b { font-weight: 600; }
  .hist .tx .to { color: var(--brass); }
  .hist time { color: var(--muted); font-size: 14px; white-space: nowrap; }
  @media (max-width: 480px) { .hist li { flex-direction: column; gap: 2px; } }

  /* ---------- Telas pequenas: só o tambor, sem o resto do layout ---------- */
  @media (max-width: 699px), (max-height: 560px) {
    .wrap { padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
    #view-wheel[hidden] { display: flex !important; }
    #view-hist { display: none !important; }
  }
  /* pequena, mas larga e baixa: tambor à esquerda, nome e botão à direita */
  @media (max-width: 699px) and (min-aspect-ratio: 5/4), (max-height: 560px) and (min-aspect-ratio: 5/4) {
    .stage-panel { flex-direction: row; align-items: stretch; justify-content: center; gap: clamp(10px, 4vw, 40px); }
    .cyl-area { flex: 0 1 auto; height: 100%; aspect-ratio: 1; }
    .controls { flex: 0 1 min(44%, 300px); justify-content: center; }
    .now { margin-top: 0; }
  }
  @media (max-height: 420px) {
    .now .by { display: none; }
  }
  /* espaço apertado: o tambor tem prioridade, nome e botão ficam compactos */
  @media (max-height: 480px), (max-width: 340px) {
    .panel { padding: 6px; }
    .stage { --size: max(90px, min(calc(100cqmin - 18px), 520px)); margin-top: 8px; }
    .marker { top: -12px; border-left-width: 9px; border-right-width: 9px; border-top-width: 18px; }
    .now { margin-top: 2px; }
    .now small { display: none; }
    .now strong { font-size: clamp(19px, min(7vw, 6dvh), 38px); min-height: 0; margin-top: 0; }
    .spin { margin-top: 5px; min-height: clamp(32px, 6.5dvh, 44px); font-size: clamp(16px, 3.2dvh, 21px); border-radius: 10px; box-shadow: 0 3px 0 var(--brass-dk); }
  }

  /* ---------- Tela grande: layout completo ---------- */
  @media (min-width: 700px) and (min-height: 561px) {
    header { display: flex; }
    .layout { grid-template-columns: minmax(0, 1fr) minmax(240px, min(38%, 400px)); }
    .queue-panel { display: flex; }
  }

  /* ---------- Modal e avisos ---------- */
  dialog { background: var(--panel); color: var(--text); border: 1px solid #3a444c; border-radius: 14px; padding: 22px; width: min(92vw, 380px); max-height: 92dvh; overflow: auto; }
  dialog::backdrop { background: rgba(8,10,12,.72); }
  dialog h2 { margin: 0 0 6px; font: 800 28px/1 var(--heading); }
  dialog p { margin: 0 0 14px; color: var(--muted); }
  dialog input { width: 100%; min-height: 48px; padding: 0 12px; background: #14181b; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .row .btn.primary { background: var(--brass); color: #1b1608; }

  .toast { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 92vw; background: #3a1f1a; border: 1px solid var(--primer); color: #f3d5cd; border-radius: 10px; padding: 10px 14px; z-index: 10; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Roleta de sacar</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-wheel" aria-selected="true" aria-controls="view-wheel">Roleta</button>
      <button class="tab" role="tab" id="tab-hist" aria-selected="false" aria-controls="view-hist">Histórico</button>
    </div>
    <button class="who" id="who" type="button" title="Trocar nome">Você: <b id="whoName">-</b></button>
  </header>

  <section class="view" id="view-wheel" role="tabpanel" aria-labelledby="tab-wheel">
    <div class="layout">
      <div class="panel stage-panel">
        <div class="cyl-area">
          <div class="stage">
            <div class="marker" id="marker" aria-hidden="true"></div>
            <div class="cyl" id="cyl" role="img" aria-label="Tambor com os nomes"></div>
          </div>
        </div>
        <div class="controls">
          <div class="now" aria-live="polite">
            <small>Vez de</small>
            <strong id="nowName">-</strong>
            <small class="by" id="nowBy"></small>
          </div>
          <button class="spin" id="spin" type="button">Girar tambor</button>
        </div>
      </div>

      <div class="panel queue-panel">
        <h2>Fila</h2>
        <ul class="queue" id="queue"></ul>
        <p class="empty" id="queueEmpty" hidden>Nenhum nome ainda. Adicione abaixo para começar.</p>
        <form class="add" id="addForm" autocomplete="off">
          <input id="addInput" type="text" maxlength="200" placeholder="Nome" aria-label="Novo nome" enterkeyhint="done">
          <button class="btn" type="submit">Adicionar</button>
        </form>
        <p class="hint">Para incluir vários de uma vez, separe por vírgula.</p>
      </div>
    </div>
  </section>

  <section class="view" id="view-hist" role="tabpanel" aria-labelledby="tab-hist" hidden>
    <div class="panel hist-panel">
      <h2>Histórico</h2>
      <ul class="hist" id="hist"></ul>
      <p class="empty" id="histEmpty" hidden>Ninguém girou ainda.</p>
    </div>
  </section>
</div>

<dialog id="nameDialog">
  <form method="dialog" id="nameForm">
    <h2>Quem é você?</h2>
    <p>Seu nome aparece no histórico quando você girar o tambor.</p>
    <input id="nameInput" type="text" maxlength="30" placeholder="Seu nome" aria-label="Seu nome" autocomplete="off" required>
    <div class="row">
      <button class="btn" type="button" id="nameCancel" hidden>Cancelar</button>
      <button class="btn primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>

<script>
(() => {
  const API = '/api/roulette';
  const SS_KEY = 'roleta:nome';
  const RADIUS = 0.36; // raio das câmaras em relação ao tamanho do tambor

  const $ = (id) => document.getElementById(id);
  const cyl = $('cyl');

  let state = { names: [], current: -1, history: [] };
  let rot = 0;
  let step = 60;
  let busy = false;
  let loaded = false;
  let anims = [];

  /* ---------- Nome do usuário (sessionStorage) ---------- */
  const getUser = () => { try { return sessionStorage.getItem(SS_KEY) || ''; } catch { return ''; } };
  const setUser = (n) => { try { sessionStorage.setItem(SS_KEY, n); } catch {} };

  const dlg = $('nameDialog');
  function renderUser() { $('whoName').textContent = getUser() || '-'; }
  function askName(canCancel) {
    $('nameInput').value = getUser();
    $('nameCancel').hidden = !canCancel;
    dlg.dataset.required = canCancel ? '' : '1';
    if (!dlg.open) dlg.showModal();
    $('nameInput').focus();
  }
  dlg.addEventListener('cancel', (e) => { if (dlg.dataset.required) e.preventDefault(); });
  $('nameCancel').addEventListener('click', () => dlg.close());
  $('nameForm').addEventListener('submit', () => {
    const v = $('nameInput').value.replace(/\s+/g, ' ').trim();
    if (!v) return;
    setUser(v.slice(0, 30));
    renderUser();
  });
  $('who').addEventListener('click', () => askName(true));

  /* ---------- API ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.hidden = true), 4000);
  }
  async function post(body) {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Não foi possível concluir.');
    return j;
  }
  async function refresh() {
    if (busy) return;
    try {
      const r = await fetch(API, { cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `Servidor respondeu com erro ${r.status}.`);
      apply(j);
    } catch (e) {
      if (!loaded) toast(e.message || 'Sem conexão com o servidor.');
    }
  }

  /* ---------- Tambor ---------- */
  // Sem ninguém na vez (-1), o tambor fica um cartucho "antes" do primeiro nome.
  const desired = () => -state.current * step;

  // Posiciona o tambor sem animação; os nomes recebem a rotação inversa para ficarem em pé.
  function setRot(deg) {
    cyl.style.transform = `rotate(${deg}deg)`;
    cyl.querySelectorAll('.ch').forEach((ch) => {
      const lb = ch.firstElementChild;
      if (lb) lb.style.transform = `rotate(${-(Number(ch.dataset.a) + deg)}deg)`;
    });
    rot = deg;
  }

  function markCurrent() {
    cyl.querySelectorAll('.ch').forEach((ch, i) => ch.classList.toggle('on', i === state.current));
  }

  function build() {
    const n = state.names.length;
    const m = Math.max(n, 6);          // sempre ao menos 6 câmaras, como um tambor de verdade
    step = 360 / m;
    const k = Math.min(0.3, 2 * RADIUS * Math.sin(Math.PI / m) * 0.86);
    cyl.innerHTML = '';
    for (let i = 0; i < m; i++) {
      const a = i * step;
      const ch = document.createElement('div');
      ch.className = 'ch';
      ch.dataset.a = a;
      ch.style.width = ch.style.height = `calc(var(--size) * ${k})`;
      ch.style.margin = `calc(var(--size) * ${-k / 2}) 0 0 calc(var(--size) * ${-k / 2})`;
      ch.style.transform = `rotate(${a}deg) translateY(calc(var(--size) * ${-RADIUS}))`;
      if (i < n) {
        const lb = document.createElement('div');
        lb.className = 'lb';
        const sp = document.createElement('span');
        sp.textContent = state.names[i];
        lb.title = state.names[i];
        lb.appendChild(sp);
        ch.appendChild(lb);
      }
      cyl.appendChild(ch);
    }
    const hub = document.createElement('div');
    hub.className = 'hub';
    cyl.appendChild(hub);
    setRot(desired());
    markCurrent();
    requestAnimationFrame(fitLabels);
  }

  // Ajusta a fonte de cada nome ao tamanho real da câmara: o maior tamanho que cabe sem cortar.
  function fitLabels() {
    cyl.querySelectorAll('.lb').forEach((lb) => {
      const D = lb.parentElement.offsetWidth;
      if (!D) return;
      const sp = lb.firstElementChild;
      sp.style.overflowWrap = 'normal';
      sp.style.maxWidth = `${D * 0.9}px`;
      sp.style.maxHeight = `${D * 0.7}px`;
      let fs = Math.min(D * 0.3, 28);
      sp.style.fontSize = `${fs}px`;
      for (let i = 0; i < 40 && fs * 0.94 >= 9 && (sp.scrollWidth > sp.clientWidth + 1 || sp.scrollHeight > sp.clientHeight + 1); i++) {
        fs *= 0.94;
        sp.style.fontSize = `${fs}px`;
      }
      if (sp.scrollWidth > sp.clientWidth + 1) sp.style.overflowWrap = 'anywhere'; // palavra gigante: quebra só como último recurso
    });
  }
  let fitRaf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitLabels); }).observe(cyl);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);

  /* ---------- Animação do giro: avança um cartucho ---------- */
  let flickTimer = 0;

  function stopAnims() {
    anims.forEach((a) => { try { a.cancel(); } catch {} });
    anims = [];
    clearTimeout(flickTimer);
  }

  // Tranco do marcador quando o tambor trava no cartucho.
  function flick() {
    $('marker').animate(
      [
        { transform: 'translateX(-50%) rotate(0deg)' },
        { transform: 'translateX(-50%) rotate(-11deg)' },
        { transform: 'translateX(-50%) rotate(0deg)' },
      ],
      { duration: 130, easing: 'ease-out' }
    );
  }

  function settle() {
    anims = [];
    busy = false;
    markCurrent();
    renderTexts(); // o nome novo só aparece quando o tambor trava
    $('nowName').animate(
      [
        { transform: 'scale(.92)', opacity: 0.4 },
        { transform: 'scale(1.06)', opacity: 1, offset: 0.6 },
        { transform: 'scale(1)', opacity: 1 },
      ],
      { duration: 380, easing: 'ease-out' }
    );
  }

  function spinTo() {
    stopAnims();
    cyl.querySelectorAll('.ch.on').forEach((c) => c.classList.remove('on'));
    const target = desired();
    let delta = (((rot - target) % 360) + 360) % 360; // sempre no mesmo sentido
    if (delta < 0.01) delta = 360;                     // um único nome: dá a volta completa
    const steps = Math.max(1, Math.round(delta / step));
    const dur = Math.min(2400, 850 + 220 * (steps - 1));
    const from = rot;
    const to = rot - delta;
    const over = Math.min(5, step * 0.1);              // quanto passa do ponto antes de travar
    busy = true;
    renderControls();

    setRot(to); // valor final gravado; a animação cuida do caminho
    const frames = (fn) => [
      { transform: fn(from),            easing: 'ease-out',                offset: 0 },
      { transform: fn(from + 2.5),      easing: 'cubic-bezier(.35,0,.15,1)', offset: 0.08 },
      { transform: fn(to - over),       easing: 'ease-in-out',             offset: 0.66 },
      { transform: fn(to + over * 0.4), easing: 'ease-out',                offset: 0.82 },
      { transform: fn(to),                                                  offset: 1 },
    ];
    const opts = { duration: dur, fill: 'none' };
    const main = cyl.animate(frames((d) => `rotate(${d}deg)`), opts);
    anims.push(main);
    cyl.querySelectorAll('.ch').forEach((ch) => {
      const lb = ch.firstElementChild;
      if (!lb) return;
      const a = Number(ch.dataset.a);
      anims.push(lb.animate(frames((d) => `rotate(${-(a + d)}deg)`), opts));
    });
    main.onfinish = settle;
    flickTimer = setTimeout(flick, dur * 0.66);
  }

  /* ---------- Render ---------- */
  function renderTexts() {
    const { names, current, history } = state;
    $('nowName').textContent = current >= 0 && names[current] ? names[current] : names.length ? 'Ninguém ainda' : '-';
    const last = history[0];
    $('nowBy').textContent = last ? `${last.by} girou por último` : names.length ? 'Gire o tambor para começar' : '';

    // fila: começa em quem está na vez
    const q = $('queue');
    q.innerHTML = '';
    const n = names.length;
    $('queueEmpty').hidden = n > 0;
    const start = current >= 0 ? current : 0;
    for (let o = 0; o < n; o++) {
      const i = (start + o) % n;
      const li = document.createElement('li');
      const isCur = current >= 0 && o === 0;
      if (isCur) li.className = 'cur';
      const nm = document.createElement('span');
      nm.className = 'nm';
      nm.textContent = names[i];
      const tag = document.createElement('span');
      tag.className = 'tag';
      const isNext = current >= 0 ? o === 1 : o === 0;
      tag.textContent = isCur ? 'Na vez' : isNext ? 'Próximo' : '';
      const rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×';
      rm.setAttribute('aria-label', `Remover ${names[i]}`);
      rm.addEventListener('click', () => remove(i));
      li.append(nm, tag, rm);
      q.appendChild(li);
    }

    // histórico
    const h = $('hist');
    h.innerHTML = '';
    $('histEmpty').hidden = history.length > 0;
    const fmt = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    for (const e of history) {
      const li = document.createElement('li');
      const tx = document.createElement('span');
      tx.className = 'tx';
      const by = document.createElement('b'); by.textContent = e.by;
      const to = document.createElement('b'); to.className = 'to'; to.textContent = e.name;
      tx.append(by, ' passou a vez para ', to);
      const tm = document.createElement('time');
      tm.textContent = fmt.format(new Date(e.at));
      li.append(tx, tm);
      h.appendChild(li);
    }
    renderControls();
  }

  function renderControls() {
    const b = $('spin');
    b.disabled = busy || state.names.length === 0;
    b.textContent = busy ? 'Girando…' : 'Girar tambor';
  }

  function apply(next) {
    const namesChanged = JSON.stringify(next.names) !== JSON.stringify(state.names);
    const curChanged = next.current !== state.current;
    const spun = (next.history[0]?.at || 0) !== (state.history[0]?.at || 0);
    const first = !loaded;
    state = next;
    loaded = true;
    if (first || namesChanged) {
      stopAnims();
      busy = false;
      build();
      renderTexts();
    } else if (curChanged || spun) {
      spinTo(); // os textos são atualizados quando o tambor para
    } else {
      renderTexts();
    }
  }

  /* ---------- Ações ---------- */
  async function remove(i) {
    try { apply(await post({ action: 'remove', index: i })); }
    catch (e) { toast(e.message); }
  }

  $('addForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const names = $('addInput').value.split(/[,\n;]/).map((s) => s.trim()).filter(Boolean);
    if (!names.length) return;
    try {
      apply(await post({ action: 'add', names }));
      $('addInput').value = '';
    } catch (e) { toast(e.message); }
  });

  $('spin').addEventListener('click', async () => {
    if (busy) return;
    if (!getUser()) { askName(false); return; }
    $('spin').disabled = true;
    try {
      apply(await post({ action: 'spin', by: getUser() }));
    } catch (e) {
      toast(e.message);
      renderControls();
    }
  });

  /* ---------- Abas ---------- */
  function showTab(which) {
    const wheel = which === 'wheel';
    $('view-wheel').hidden = !wheel;
    $('view-hist').hidden = wheel;
    $('tab-wheel').setAttribute('aria-selected', wheel);
    $('tab-hist').setAttribute('aria-selected', !wheel);
  }
  $('tab-wheel').addEventListener('click', () => showTab('wheel'));
  $('tab-hist').addEventListener('click', () => showTab('hist'));

  /* ---------- Início ---------- */
  renderUser();
  if (!getUser()) askName(false);
  refresh();
  setInterval(refresh, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
